name: Legacy QA API - Newman

on:
  workflow_dispatch:
  push:
    paths:
      - 'legacy-portfolio/qa-portfolio/api-postman/**'
      - '.github/workflows/qa-api-newman.yml'
  pull_request:
    paths:
      - 'legacy-portfolio/qa-portfolio/api-postman/**'
      - '.github/workflows/qa-api-newman.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-portfolio/qa-portfolio/api-postman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
