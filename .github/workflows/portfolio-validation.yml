name: Legacy Portfolio Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'legacy-portfolio/**'
      - '.github/workflows/portfolio-validation.yml'

permissions:
  contents: read

jobs:
  legacy-checks:
    name: Legacy portfolio integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve legacy history
        run: |
          test -d legacy-portfolio/cobol-portfolio
          test -d legacy-portfolio/mainframe-knowledge
          test -d legacy-portfolio/data-portfolio
          test -d legacy-portfolio/qa-portfolio
          test -f legacy-portfolio/MAINFRAME-INTERVIEW-GUIDE.md
          echo 'Legacy portfolio preserved outside the Front-End-first root.'
