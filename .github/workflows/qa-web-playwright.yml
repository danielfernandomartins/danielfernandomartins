name: QA Web - Playwright

on:
  push:
    paths:
      - 'qa-portfolio/web-playwright/**'
      - '.github/workflows/qa-web-playwright.yml'
  pull_request:
    paths:
      - 'qa-portfolio/web-playwright/**'
      - '.github/workflows/qa-web-playwright.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-portfolio/web-playwright

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-portfolio/web-playwright/playwright-report/
          if-no-files-found: ignore
