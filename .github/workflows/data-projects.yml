name: Projetos SQL e Power BI
on:
  push:
    paths:
      - 'projetos-dados/**'
      - '.github/workflows/data-projects.yml'
  pull_request:
    paths:
      - 'projetos-dados/**'
      - '.github/workflows/data-projects.yml'
permissions:
  contents: read
jobs:
  conferir-dados-e-estrutura:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: SQL, resultados e estrutura Power BI
        run: python3 projetos-dados/validar.py
